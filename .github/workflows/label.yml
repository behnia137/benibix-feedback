name: Label by tool
# Puts the tool's label and the kind (feedback, bug or idea) on a new issue, from the answers in the one
# form; the map is .github/tool-labels.json, written by scripts/gen.mjs.
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const map = JSON.parse(require('fs').readFileSync('.github/tool-labels.json', 'utf8'))
            const body = context.payload.issue.body || ''
            const answer = q => ((new RegExp('### ' + q + '\\s+([^\\n]+)').exec(body) || [])[1] || '').trim()
            const labels = [answer('Which tool is it about\\?'), answer('What kind of message is this\\?')].map(a => map[a]).filter(Boolean)
            if (labels.length) await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels })
