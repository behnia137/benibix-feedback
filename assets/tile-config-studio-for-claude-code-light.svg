<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic} .ring{opacity:0;animation:ring 9.6s 0.0s ease-in-out infinite} @keyframes ring{0%,100%{opacity:0} 4%{opacity:1} 10%{opacity:1} 15%{opacity:0}}
