<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none">
<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic} .move{animation:move 1.6s linear infinite} @keyframes move{to{stroke-dashoffset:-40}} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0.0%" stop-color="#d9431c"/><stop offset="20.0%" stop-color="#b86e00"/><stop offset="40.0%" stop-color="#3b8a17"/><stop offset="60.0%" stop-color="#1f5fd6"/><stop offset="80.0%" stop-color="#8a3fe0"/><stop offset="100.0%" stop-color="#d9431c"/></linearGradient></defs>
  <path d="M 194.66666666666666 46 H 1005.3333333333334" stroke="url(#rb)" stroke-width="2.5" stroke-dasharray="6 14" class="move"/>
  <rect x="0.75" y=".75" width="387.8333333333333" height="208.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
      <text x="26" y="62" font-size="38" class="serif" fill="#1b488f">01</text>
      <text x="26" y="112" font-size="24" font-weight="800" letter-spacing="-.5" fill="#0b0b10">Pick the tool</text>
      <text font-size="17" fill="#474753"><tspan x="26" y="148">Press Send feedback in any tool's</tspan><tspan x="26" y="174">top bar, or choose its tile below.</tspan></text>
<rect x="406.0833333333333" y=".75" width="387.8333333333333" height="208.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
      <text x="431.3333333333333" y="62" font-size="38" class="serif" fill="#53792e">02</text>
      <text x="431.3333333333333" y="112" font-size="24" font-weight="800" letter-spacing="-.5" fill="#0b0b10">Say what it is</text>
      <text font-size="17" fill="#474753"><tspan x="431.3333333333333" y="148">Feedback, a bug or an idea.</tspan><tspan x="431.3333333333333" y="174">Only the details are required.</tspan></text>
<rect x="811.4166666666666" y=".75" width="387.8333333333333" height="208.5" rx="18" fill="#ffffff" stroke="rgba(16,18,27,.10)" stroke-width="1.5"/>
      <text x="836.6666666666666" y="62" font-size="38" class="serif" fill="#943e23">03</text>
      <text x="836.6666666666666" y="112" font-size="24" font-weight="800" letter-spacing="-.5" fill="#0b0b10">Post it here</text>
      <text font-size="17" fill="#474753"><tspan x="836.6666666666666" y="148">From your own GitHub account.</tspan><tspan x="836.6666666666666" y="174">I read every one and answer here.</tspan></text>
