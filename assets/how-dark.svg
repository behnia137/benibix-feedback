<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none">
<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-style:italic} .move{animation:move 1.6s linear infinite} @keyframes move{to{stroke-dashoffset:-40}} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0.0%" stop-color="#ff6b3d"/><stop offset="20.0%" stop-color="#ffc72c"/><stop offset="40.0%" stop-color="#8fd14f"/><stop offset="60.0%" stop-color="#2f7cf6"/><stop offset="80.0%" stop-color="#a855f7"/><stop offset="100.0%" stop-color="#ff6b3d"/></linearGradient></defs>
  <path d="M 194.66666666666666 46 H 1005.3333333333334" stroke="url(#rb)" stroke-width="2.5" stroke-dasharray="6 14" class="move"/>
  <rect x="0.75" y=".75" width="387.8333333333333" height="208.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
      <text x="26" y="62" font-size="38" class="serif" fill="#2f7cf6">01</text>
      <text x="26" y="112" font-size="24" font-weight="800" letter-spacing="-.5" fill="#f5f5f7">Pick the tool</text>
      <text font-size="17" fill="#a8a8b5"><tspan x="26" y="148">Press Send feedback in any tool's</tspan><tspan x="26" y="174">top bar, or choose its tile below.</tspan></text>
<rect x="406.0833333333333" y=".75" width="387.8333333333333" height="208.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
      <text x="431.3333333333333" y="62" font-size="38" class="serif" fill="#8fd14f">02</text>
      <text x="431.3333333333333" y="112" font-size="24" font-weight="800" letter-spacing="-.5" fill="#f5f5f7">Say what it is</text>
      <text font-size="17" fill="#a8a8b5"><tspan x="431.3333333333333" y="148">Feedback, a bug or an idea.</tspan><tspan x="431.3333333333333" y="174">Only the details are required.</tspan></text>
<rect x="811.4166666666666" y=".75" width="387.8333333333333" height="208.5" rx="18" fill="#0f0f15" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>
      <text x="836.6666666666666" y="62" font-size="38" class="serif" fill="#ff6b3d">03</text>
      <text x="836.6666666666666" y="112" font-size="24" font-weight="800" letter-spacing="-.5" fill="#f5f5f7">Post it here</text>
      <text font-size="17" fill="#a8a8b5"><tspan x="836.6666666666666" y="148">From your own GitHub account.</tspan><tspan x="836.6666666666666" y="174">I read every one and answer here.</tspan></text>
